<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Paid Inbox — attention has a price</title>
    <meta
      name="description"
      content="Pay to reach an inbox, earn by replying. Escrowed messaging on Unicity, connected with a Sphere wallet."
    />
    <meta name="theme-color" content="#060606" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fefefe" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <script>
      // Set the theme before first paint so a reload never flashes the wrong one.
      (function () {
        try {
          var saved = localStorage.getItem("paidinbox:theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
